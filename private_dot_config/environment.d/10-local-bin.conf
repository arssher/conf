# Read by `systemd --user` at session start, and by nothing else: not .profile,
# not .bashrc. That makes it the only route to the environment of GUI programs
# -- the GNOME app launcher, user services, anything not started from a shell --
# and it works on X11 as much as on Wayland, where .profile is never sourced.
#
# Edits take effect at the NEXT LOGIN. There is no reload: `systemctl --user
# daemon-reexec` re-runs the generators but does not re-import into already
# running apps. To check what the session actually has, use
# `systemctl --user show-environment`.
#
# Syntax is NOT shell -- no `export`, no command substitution, no conditionals.
# Assignments only; lines starting with # or ; are comments. ${VAR} expands from
# variables already set, which is why ${HOME} and ${PATH} below work.
#
# ~/.profile adds this directory too, but behind an `if [ -d ]` test, and at one
# login the directory did not exist yet -- so the launcher silently lost it
# while the unconditional lines below it took effect. This one is unconditional
# on purpose (see 26fa777).
PATH=${HOME}/.local/bin:${PATH}
